name: Rail 3 CI

# Rail 3 integration-test harness (task W183).
#
# Runs the Rail 3 test suite against an EPHEMERAL LOCAL Supabase stack started
# inside the CI runner — it never connects to the hosted production project
# (drktcxggaizkbvqccfhp). This is the merge gate that lets Rail 3 do real
# RLS/integration testing while keeping production untouched (free-tier-first
# test strategy).
#
# Additive and Rail-3-scoped: this workflow does NOT build, gate, or alter the
# existing admin/ web app — that ships to Cloudflare (deploy-cloudflare.yml) on
# push to master, unaffected.

on:
  pull_request:
    # W306: rail3-integration is where the Rail 3 app lands; its PRs ran no CI before.
    branches: [master, rail3-integration]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.sql'   # seed runs on `supabase start` — it can break the gate (D49, #56)
      - '.github/workflows/rail3-ci.yml'
      - 'mobile/**'
      # W310: rule T15.1 scans these for a realtime channel opened without private: true,
      # so a change there has to run the denial suite too.
      - 'admin/src/**'
      - 'worker/**'
      - 'supabase/functions/**'
  workflow_dispatch:

# Avoid piling up redundant runs on rapid pushes to the same PR.
concurrency:
  group: rail3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-rls-gate:
    name: Local Supabase + RLS isolation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # W306: pinned. `latest` became CLI 3.0.0, which rejects this repo's config.toml.
          version: 2.89.1

      - name: Start local Supabase stack (applies all migrations)
        # `supabase start` brings up a local Postgres + Auth + Realtime in Docker
        # and applies supabase/migrations. Nothing here touches the hosted project.
        run: supabase start

      - name: Run Rail 3 RLS isolation gate
        run: |
          # Resolve the LOCAL stack's DB connection string from the CLI itself.
          eval "$(supabase status -o env)"
          DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          echo "Running RLS gate against local stack ($DB_URL)"
          case "$DB_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: DB_URL is not a local address ($DB_URL)"; exit 1 ;;
          esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rail3_rls_isolation.test.sql
          # W299: account self-deletion (grants, last-admin block, reassign/anonymise, idempotency).
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/w299_account_deletion.test.sql
          # D97: tenants.ai_api_key is service-role only; branding stays readable.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/d97_tenant_key_grants.test.sql

      # ── W182: DoD-12 behavioral isolation matrix (DB RLS + Broadcast authz) ──
      # Runs through the real Realtime server, which the SQL gate above cannot
      # reach — a Broadcast leak (G-1) would pass DB-only tests. The matrix
      # SKIPs its Rail 3 assertions on branches without the held W169/W170
      # migrations, so it is safe on every PR this workflow gates.
      - name: Export local stack env for the isolation matrix
        run: |
          eval "$(supabase status -o env)"
          case "$API_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: API_URL is not a local address ($API_URL)"; exit 1 ;;
          esac
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          # When this branch carries Rail 3 migrations the matrix must NOT be
          # allowed to silently skip into a green run — the test hard-fails if
          # the schema probe errors while EXPECT_RAIL3 is set.
          if ls supabase/migrations/*rail3* >/dev/null 2>&1; then
            echo "EXPECT_RAIL3=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        # No lockfile in mobile/ yet (EAS builds resolve fresh too) — plain install.
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Run DoD-12 isolation matrix (W182)
        working-directory: mobile
        run: npm test

      # ── W308: publish the schema of a database built from migrations alone ──
      # A hosted database (staging) is compared against these two files to prove it
      # carries no drift. The workstation has no Docker, so CI is the only place a
      # trunk-built database exists. The stack is rebuilt WITHOUT seed.sql first:
      # the seed's local-only blanket grants (D49) would otherwise show up as
      # differences that no migration made. Runs last because the reset wipes the
      # seeded data the tests above rely on.
      - name: Rebuild from migrations only and dump the schema (W308)
        run: |
          eval "$(supabase status -o env)"
          DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          case "$DB_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: DB_URL is not a local address ($DB_URL)"; exit 1 ;;
          esac
          supabase db reset --local --no-seed
          mkdir -p schema-out
          supabase db dump --local -f schema-out/trunk_schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -f supabase/tests/schema_fingerprint.sql > schema-out/trunk_fingerprint.json
          wc -l schema-out/trunk_schema.sql
          test -s schema-out/trunk_schema.sql && test -s schema-out/trunk_fingerprint.json

      - name: Upload trunk-built schema (W308)
        uses: actions/upload-artifact@v4
        with:
          name: trunk-schema
          path: schema-out/
          if-no-files-found: error
          retention-days: 30

      # ── W309: denial suite T1 to T16 against the migration-only database ──
      # Runs after the seed-free rebuild above, so the database carries exactly what the
      # migrations grant (seed.sql adds local-only grants a hosted database never has).
      # The run must match mobile/tests/denial/baseline.json: a rule that turns red where
      # the baseline says green is a regression, and a rule that turns green must have its
      # baseline entry updated in the same change.
      - name: Run denial suite T1-T16 (W309)
        working-directory: mobile
        run: |
          eval "$(supabase status -o env)"
          case "$API_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: API_URL is not a local address ($API_URL)"; exit 1 ;;
          esac
          # `supabase db reset` rebuilds the database under Realtime, which then sometimes never
          # answers again (seen as "transport failure" for the whole run). Restart it so it
          # boots against the rebuilt database; the suite waits until it delivers.
          docker ps --filter name=supabase_realtime -q | xargs -r docker restart
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npm run denial:local -- --out ../denial-out

      - name: Upload denial report (W309)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: denial-report
          path: denial-out/
          if-no-files-found: warn
          retention-days: 30

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
