name: Rail 3 CI

# Rail 3 integration-test harness (task W183).
#
# Runs the Rail 3 test suite against an EPHEMERAL LOCAL Supabase stack started
# inside the CI runner — it never connects to the hosted production project
# (drktcxggaizkbvqccfhp). This is the merge gate that lets Rail 3 do real
# RLS/integration testing while keeping production untouched (free-tier-first
# test strategy).
#
# Additive and Rail-3-scoped: this workflow does NOT build, gate, or alter the
# existing admin/ web app — that ships via Vercel on push to master, unaffected.

on:
  pull_request:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.sql'   # seed runs on `supabase start` — it can break the gate (D49, #56)
      - '.github/workflows/rail3-ci.yml'
      - 'mobile/**'
  workflow_dispatch:

# Avoid piling up redundant runs on rapid pushes to the same PR.
concurrency:
  group: rail3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-rls-gate:
    name: Local Supabase + RLS isolation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack (applies all migrations)
        # `supabase start` brings up a local Postgres + Auth + Realtime in Docker
        # and applies supabase/migrations. Nothing here touches the hosted project.
        run: supabase start

      - name: Run Rail 3 RLS isolation gate
        run: |
          # Resolve the LOCAL stack's DB connection string from the CLI itself.
          eval "$(supabase status -o env)"
          DB_URL="${DB_URL:-postgresql://postgres:postgres@127.0.0.1:54322/postgres}"
          echo "Running RLS gate against local stack ($DB_URL)"
          case "$DB_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: DB_URL is not a local address ($DB_URL)"; exit 1 ;;
          esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rail3_rls_isolation.test.sql

      # ── W182: DoD-12 behavioral isolation matrix (DB RLS + Broadcast authz) ──
      # Runs through the real Realtime server, which the SQL gate above cannot
      # reach — a Broadcast leak (G-1) would pass DB-only tests. The matrix
      # SKIPs its Rail 3 assertions on branches without the held W169/W170
      # migrations, so it is safe on every PR this workflow gates.
      - name: Export local stack env for the isolation matrix
        run: |
          eval "$(supabase status -o env)"
          case "$API_URL" in
            *127.0.0.1*|*localhost*) : ;;  # ok — local only
            *) echo "::error::Refusing to run: API_URL is not a local address ($API_URL)"; exit 1 ;;
          esac
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          # When this branch carries Rail 3 migrations the matrix must NOT be
          # allowed to silently skip into a green run — the test hard-fails if
          # the schema probe errors while EXPECT_RAIL3 is set.
          if ls supabase/migrations/*rail3* >/dev/null 2>&1; then
            echo "EXPECT_RAIL3=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        # No lockfile in mobile/ yet (EAS builds resolve fresh too) — plain install.
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Run DoD-12 isolation matrix (W182)
        working-directory: mobile
        run: npm test

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
